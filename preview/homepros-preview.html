Atendemos companhias de brasileiros e americanos nos Estados Unidos e no Canad\xE1, ajudando profissionais da constru\xE7\xE3o e de servi\xE7os residenciais a fortalecer sua presen\xE7a na internet, divulgar seus trabalhos e alcan\xE7ar mais clientes.

Voc\xEA pode atuar de qualquer lugar do mundo, mesmo come\xE7ando sem conhecimento de ingl\xEAs. A capacita\xE7\xE3o come\xE7a pelo atendimento a brasileiros e inclui o aprendizado progressivo do idioma, preparando o licenciado para atender clientes americanos com maior autonomia.`,photos:[],sections:[{title:"Servi\xE7os que comercializamos",body:`\u2022 Cria\xE7\xE3o de websites.
\u2022 Filmagens em campo e com drone.
\u2022 Produ\xE7\xE3o de v\xEDdeos publicit\xE1rios.
\u2022 Cria\xE7\xE3o de logomarcas.
\u2022 Administra\xE7\xE3o de redes sociais.
\u2022 Cria\xE7\xE3o e otimiza\xE7\xE3o do Google Business Profile \u2014 Google Meu Neg\xF3cio.
\u2022 Gest\xE3o de an\xFAncios no Google e no Facebook.
\u2022 Cria\xE7\xE3o de cart\xF5es digitais.
\u2022 Divulga\xE7\xE3o em guia de servi\xE7os locais.
\u2022 Apoio na apresenta\xE7\xE3o de servi\xE7os e elabora\xE7\xE3o de or\xE7amentos.

Nosso foco abrange 100 categorias de servi\xE7os da constru\xE7\xE3o e de manuten\xE7\xE3o residencial, incluindo pintura, limpeza, reformas e outras especialidades. Ajudamos essas companhias a ampliar sua presen\xE7a digital e a serem encontradas por clientes da regi\xE3o.`},{title:"Assessorias e servi\xE7os de parceiros",body:`Al\xE9m das solu\xE7\xF5es de marketing digital, o licenciado poder\xE1 apresentar aos clientes servi\xE7os de parceiros especializados, como:

\u2022 Assessoria para solicita\xE7\xE3o de visto americano de turismo.
\u2022 Assessoria para processos de imigra\xE7\xE3o e resid\xEAncia permanente nos Estados Unidos.
\u2022 Atendimento jur\xEDdico com advogados especializados em imigra\xE7\xE3o.

A an\xE1lise de cada caso e a execu\xE7\xE3o desses servi\xE7os ficam sob responsabilidade dos respectivos profissionais. A contrata\xE7\xE3o da assessoria n\xE3o garante a aprova\xE7\xE3o de vistos ou de processos de imigra\xE7\xE3o.`},{title:"Remunera\xE7\xE3o do licenciado",body:`O licenciado receber\xE1 comiss\xE3o de 54% sobre as vendas dos servi\xE7os de marketing digital comercializados, conforme os crit\xE9rios e condi\xE7\xF5es definidos no contrato de licen\xE7a.

Nos servi\xE7os de imigra\xE7\xE3o contratados com o advogado parceiro por indica\xE7\xE3o do licenciado, a comiss\xE3o prevista \xE9 de 3%, conforme os crit\xE9rios e condi\xE7\xF5es do respectivo acordo. A execu\xE7\xE3o desses servi\xE7os fica sob responsabilidade do advogado parceiro.`},{title:"Sua atua\xE7\xE3o como licenciado",body:`Voc\xEA n\xE3o precisa criar websites nem executar os servi\xE7os de marketing digital vendidos. A Home Pros Constructors fica respons\xE1vel pela produ\xE7\xE3o e execu\xE7\xE3o dos servi\xE7os contratados.

Seu papel ser\xE1 atender os clientes vinculados \xE0 sua cidade de representa\xE7\xE3o, apresentar as solu\xE7\xF5es dispon\xEDveis, acompanhar as solicita\xE7\xF5es e manter o relacionamento comercial, com treinamento e suporte da Home Pros Constructors.`},{title:"Materiais e treinamento",body:`O licenciado receber\xE1:

\u2022 Website direcionado \xE0 cidade de {city}.
\u2022 Videoaulas e orienta\xE7\xF5es para organizar a presen\xE7a digital do projeto.
\u2022 Treinamento para atendimento ao cliente e apresenta\xE7\xE3o dos servi\xE7os.
\u2022 Capacita\xE7\xE3o progressiva em ingl\xEAs, do n\xEDvel inicial ao atendimento com maior autonomia.
\u2022 Arquivos personalizados para {city}, incluindo identidade visual, banners, descri\xE7\xF5es das redes sociais e textos para conte\xFAdos.
\u2022 Materiais para estruturar a presen\xE7a do projeto no YouTube, Facebook, Instagram e X.
